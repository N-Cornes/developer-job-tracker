services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - jobtracker_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobtracker
      DATABASE_USERNAME: jobtracker
      DATABASE_PASSWORD: jobtracker
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: local-docker-secret-change-before-production-987654321
      JWT_EXPIRATION_HOURS: 24
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  jobtracker_postgres:
