services:
  - type: web
    name: nicholas-cornes-job-tracker-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nicholas-cornes-job-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: CORS_ALLOWED_ORIGINS
        value: https://nicholas-cornes-job-tracker.onrender.com

  - type: web
    name: nicholas-cornes-job-tracker
    runtime: static
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          name: nicholas-cornes-job-tracker-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nicholas-cornes-job-tracker-db
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    databaseName: jobtracker
    user: jobtracker
    ipAllowList: []
